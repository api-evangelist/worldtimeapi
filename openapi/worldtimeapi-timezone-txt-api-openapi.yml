openapi: 3.2.0
info:
  title: World Time Timezone.txt API
  version: '2025-10-01'
  description: API to get the current local time details for a given timezone or IP address
servers:
- url: https://public.timeapi.world/api/
tags:
- name: Timezone.txt
paths:
  /timezone.txt:
    get:
      summary: a listing of all timezones
      responses:
        default:
          $ref: '#/components/responses/SuccessfulListTextResponse'
      tags:
      - Timezone.txt
      operationId: getTimezoneTxt
      x-operation-id-source: derived
components:
  schemas:
    ListTextResponse:
      type: string
      description: a list of available timezones, one per line
  responses:
    SuccessfulListTextResponse:
      description: the list of available timezones in plain text
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ListTextResponse'
          example: 'Africa/Abidjan

            Africa/Accra

            Africa/Addis_Ababa

            Africa/Algiers

            Africa/Asmara

            Africa/Asmera

            Africa/Bamako

            '
x-provenance:
  method: harvested
  publisher: World Time API
  source: https://public.timeapi.world/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
